version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Delay proposing newly published releases to reduce exposure to
    # supply chain attacks that are caught/yanked shortly after release.
    cooldown:
      default-days: 14
    # Every bump — majors included — arrives in one reviewable PR per
    # ecosystem; the ignore lists keep known-broken majors out of the batch.
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /companion
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      companion-all:
        applies-to: version-updates
        patterns: ["*"]
      companion-security:
        applies-to: security-updates
        patterns: ["*"]
    # Held majors, each blocked upstream; revisit when the blocker moves.
    # typescript 7 is the native compiler — typescript-eslint peers <6.1.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
  # The tauri crates here and @tauri-apps/* in the npm group above must share a
  # minor version, or `tauri build` refuses to run; land their bumps together.
  - package-ecosystem: cargo
    directory: /companion/src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      companion-rust-all:
        applies-to: version-updates
        patterns: ["*"]
      companion-rust-security:
        applies-to: security-updates
        patterns: ["*"]
