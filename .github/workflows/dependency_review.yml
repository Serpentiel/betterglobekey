name: Dependency Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip workflows')) ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          # glib 0.18 comes only from Tauri 2's Linux GTK 3 bindings (gtk 0.18,
          # the last gtk3-rs release; the fix is in glib 0.20). The companion
          # ships for macOS only, where glib is not compiled. Mirrors
          # companion/src-tauri/osv-scanner.toml.
          allow-ghsas: GHSA-wrw7-89jp-8q8g
