kind: Added
body: "Each keyboard can switch input sources with its own trigger key, such as Caps Lock, Right Command, F13, or Insert: set it under `trigger.keyboards` by keyboard, or record it in the companion's Trigger Key section. Keyboards not listed keep their Globe key, if they have one. The key is silenced so it only switches input sources, and read straight from the keyboard, which needs the Input Monitoring permission; `doctor` reports it. The companion and `doctor` list every connected keyboard with its trigger and key mappings."
