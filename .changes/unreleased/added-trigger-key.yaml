kind: Added
body: "Each keyboard can switch input sources with trigger keys of its own, as many as you like, such as Caps Lock, Right Command, F13, or Insert: list them under `trigger.keyboards` by keyboard, or record them in the companion's Trigger Keys section. `trigger.globe` turns the Globe key on or off for every keyboard at once, since macOS cannot tell which keyboard a Globe press came from. A key is silenced so it only switches input sources, and read straight from the keyboard, which needs the Input Monitoring permission; `doctor` reports it. The companion and `doctor` list every connected keyboard with its trigger keys and key mappings."
