kind: Added
body: "Each keyboard can switch input sources with its own trigger keys, as many as you like, such as Caps Lock, Right Command, F13, or Insert, alongside its Globe key or instead of it: list them under `trigger.keyboards` by keyboard, or record them in the companion's Trigger Keys section. Keyboards not listed keep their Globe key, if they have one. A key is silenced so it only switches input sources, and read straight from the keyboard, which needs the Input Monitoring permission; `doctor` reports it. The companion and `doctor` list every connected keyboard with its trigger keys and key mappings."
