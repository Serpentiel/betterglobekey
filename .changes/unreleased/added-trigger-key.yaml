kind: Added
body: "Keyboards without a Globe key can switch input sources with another key, such as Caps Lock, Right Command, or F13, picked with `trigger.key` or recorded in the companion. By default the key becomes an fn key, with the fn shortcuts, on keyboards without a Globe key; `trigger.mode: dedicated` makes it the only key that switches, leaving Globe to macOS, and `trigger.mode: pass_through` keeps its normal function. `trigger.keyboards` and the companion's Keyboards panel choose the keyboards it applies to and show every keyboard's key mappings."
