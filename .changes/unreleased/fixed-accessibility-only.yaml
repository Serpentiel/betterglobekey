kind: Fixed
body: Accessibility is the only permission to grant. macOS grants the Input Monitoring that recording keys and a keyboard's own trigger keys need along with it, as soon as the service asks, so recording a key no longer fails the first time. The companion's Input Monitoring notice, the doctor's Input Monitoring line and the control API's Input Monitoring fields are gone; update the companion along with the service, as an older one shows its Input Monitoring notice against this service.
time: 2026-10-29T00:40:00.000000+02:00
