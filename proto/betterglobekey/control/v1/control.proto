syntax = "proto3";

package betterglobekey.control.v1;

option go_package = "github.com/Serpentiel/betterglobekey/internal/gen/betterglobekey/control/v1;controlv1";

// ConfigService lets a local companion application read and update the daemon's
// configuration and inspect the system's input sources. It is served over a
// Unix domain socket in the user's home directory and is intended for local,
// single-user use only.
service ConfigService {
  // GetConfig returns the daemon's current configuration.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // ApplyConfig validates and persists a new configuration. The daemon reloads
  // it automatically once it is written.
  rpc ApplyConfig(ApplyConfigRequest) returns (ApplyConfigResponse);

  // ListInputSources returns every selectable input source with its localized
  // name.
  rpc ListInputSources(ListInputSourcesRequest) returns (ListInputSourcesResponse);

  // GetVersion returns the running daemon's version and build commit.
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);

  // GetStatus reports the daemon's runtime state, including whether it holds the
  // Accessibility permission the global event tap requires. Because the daemon
  // answers from its own process, this reflects the daemon's grant rather than
  // that of whatever launched the caller.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // ListKeyboards reports every connected keyboard, its trigger, and its key
  // mappings, plus the system-wide key mappings. It reports against the
  // configuration on disk.
  rpc ListKeyboards(ListKeyboardsRequest) returns (ListKeyboardsResponse);

  // RecordKey returns the next key pressed, read from raw keyboard input, which
  // needs Input Monitoring: FAILED_PRECONDITION without it. macOS grants Input
  // Monitoring with Accessibility, once the daemon asks. Raw input reports a
  // key before any remapping, so a remapped key records as itself. It waits
  // until the caller's deadline, or 30 seconds.
  rpc RecordKey(RecordKeyRequest) returns (RecordKeyResponse);
}

// Config mirrors the daemon's resolved configuration.
message Config {
  // logger holds the logging configuration.
  Logger logger = 1;

  // double_press configures collection switching.
  DoublePress double_press = 2;

  // reverse configures the modifier that inverts a press.
  Reverse reverse = 3;

  // hud configures the on-screen overlay.
  Hud hud = 4;

  // collections are the ordered input source collections the trigger key
  // cycles through.
  repeated Collection collections = 5;

  // trigger selects the keys that switch input sources. When absent, the Globe
  // key switches and no keyboard has keys of its own.
  Trigger trigger = 6;
}

// Trigger selects the keys that switch input sources: the Globe key, on every
// keyboard that has one, and each keyboard's own keys.
message Trigger {
  reserved 1 to 5;
  reserved "key", "mode", "pass_through";

  // keyboards are the trigger keys of single keyboards, by ID: the vendor and
  // product IDs as four lower-case hex digits each ("05ac:029c"). Any other
  // keyboard has none.
  map<string, KeyboardTriggers> keyboards = 6;

  // globe makes the Globe key switch on every keyboard that has one; the
  // daemon cannot tell which keyboard a Globe press came from. When unset, it
  // does.
  optional bool globe = 7;
}

// KeyboardTriggers are one keyboard's trigger keys, each different.
message KeyboardTriggers {
  repeated KeyboardTrigger keys = 1;
}

// KeyboardTrigger is one of a keyboard's trigger keys and how it is detected.
message KeyboardTrigger {
  // key is the trigger key: caps_lock, right_command, right_option,
  // right_control, right_shift, left_command, left_option, left_control,
  // left_shift, f13 through f20, menu, insert, print_screen, scroll_lock, or
  // pause; the Globe key is Trigger.globe.
  string key = 1;

  // mode is how the key is detected, both needing Input Monitoring: dedicated
  // (silenced and read from raw input; the default when empty) or
  // pass_through (keeps its function and is read from raw input; not allowed
  // for caps_lock).
  string mode = 2;
}

// Logger holds the logging configuration.
message Logger {
  // path is the path to the log file.
  string path = 1;

  // level is the minimum level to log: debug, info, warn, or error.
  string level = 2;

  // retention_days is the number of days to retain rotated log files.
  int32 retention_days = 3;

  // retention_files is the number of rotated log files to retain.
  int32 retention_files = 4;
}

// DoublePress configures the double-press (collection switching) gesture.
message DoublePress {
  // enabled turns collection switching on or off.
  bool enabled = 1;

  // maximum_delay is the longest gap between two presses still counted as a
  // double press, as a Go duration string (e.g. "250ms").
  string maximum_delay = 2;
}

// Reverse configures the modifier that inverts a press.
message Reverse {
  // enabled turns the reverse modifier on or off.
  bool enabled = 1;

  // modifier is the key held to reverse a press: shift, option, control, or
  // command.
  string modifier = 2;
}

// Hud configures the on-screen overlay.
message Hud {
  // enabled shows or hides the overlay.
  bool enabled = 1;

  // duration is how long the overlay stays visible, as a Go duration string.
  string duration = 2;

  // show_collection includes the collection name as a subtitle.
  bool show_collection = 3;
}

// Collection is a named, ordered set of input source identifiers.
message Collection {
  // name uniquely identifies the collection.
  string name = 1;

  // sources are the input source identifiers, in cycling order.
  repeated string sources = 2;
}

// InputSource is a selectable input source and its localized display name.
message InputSource {
  // id is the input source identifier (e.g. "com.apple.keylayout.US").
  string id = 1;

  // name is the localized display name.
  string name = 2;
}

message GetConfigRequest {}

message GetConfigResponse {
  Config config = 1;
}

message ApplyConfigRequest {
  Config config = 1;
}

message ApplyConfigResponse {}

message ListInputSourcesRequest {}

message ListInputSourcesResponse {
  repeated InputSource sources = 1;
}

message GetVersionRequest {}

message GetVersionResponse {
  // version is the release version, or "dev" for unversioned builds.
  string version = 1;

  // commit is the build's git commit, when embedded.
  string commit = 2;
}

message GetStatusRequest {}

message GetStatusResponse {
  // accessibility_trusted reports whether the daemon holds the Accessibility
  // permission required by the global event tap.
  bool accessibility_trusted = 1;

  reserved 2;
}

message ListKeyboardsRequest {}

message ListKeyboardsResponse {
  // keyboards are the connected keyboards.
  repeated Keyboard keyboards = 1;

  // system_mappings are the system-wide key mappings (`hidutil property --set`).
  repeated KeyMapping system_mappings = 2;

  reserved 3, 4;
}

// Keyboard is a connected keyboard.
message Keyboard {
  // id is the vendor and product IDs ("05ac:029c"), as used in overrides.
  string id = 1;

  // name is the product name, or empty.
  string name = 2;

  // transport is the connection, such as USB or Bluetooth, or empty.
  string transport = 3;

  // built_in reports a laptop's own keyboard.
  bool built_in = 4;

  // has_globe reports whether the keyboard has a Globe key of its own.
  bool has_globe = 5;

  reserved 6, 7, 9;
  reserved "in_scope", "trigger_mapping", "trigger";

  // other_mappings are the keyboard's mappings set by other tools.
  repeated KeyMapping other_mappings = 8;

  // listed reports whether the keyboard is listed in Trigger.keyboards.
  bool listed = 10;

  // trigger_mappings are the daemon's mappings on the keyboard, one per
  // dedicated trigger key in place.
  repeated KeyMapping trigger_mappings = 11;

  // triggers are the keyboard's trigger keys.
  repeated KeyboardTrigger triggers = 12;
}

// KeyMapping remaps one HID usage to another.
message KeyMapping {
  // src and dst are HID usages: the usage page shifted left 32 bits, or'd
  // with the usage.
  uint64 src = 1;
  uint64 dst = 2;

  // src_name and dst_name name the keys, or give the usage in hex.
  string src_name = 3;
  string dst_name = 4;
}

message RecordKeyRequest {
  // keyboard_id limits recording to one keyboard ("05ac:029c"); empty records
  // a key from any keyboard.
  string keyboard_id = 1;
}

message RecordKeyResponse {
  // key is the trigger key pressed, or empty when the key cannot be a trigger.
  string key = 1;

  // key_name names the key pressed.
  string key_name = 2;

  // keyboard_id is the keyboard the key was pressed on.
  string keyboard_id = 3;
}
