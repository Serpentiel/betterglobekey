[package]
name = "betterglobekey-companion"
version = "0.0.0"
description = "Desktop companion app for editing the betterglobekey configuration."
authors = ["Aleksandr Zaruchevskii"]
license = "MIT"
edition = "2024"
publish = false

[build-dependencies]
protox = "0.9.1"
tauri-build = { version = "2.7.0", features = [] }
tonic-prost-build = "0.14.6"

[dependencies]
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-opener = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
tokio = { version = "1", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = "0.5.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
